name: Bug report
description: Report a reproducible problem in StaghojQR
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest example that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StaghojQR version
      placeholder: 2.0.1
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
